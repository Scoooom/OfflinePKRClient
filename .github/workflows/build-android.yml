name: Build Offline Client APK

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (leave blank to use this workflow run number)'
        required: false
        type: string
      dev:
        description: 'Dev build (dev icon/app id)'
        required: false
        type: boolean
        default: false
      branch:
        description: 'PokeRogue branch to build from'
        required: false
        type: string
        default: 'main'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install ImageMagick
        run: |
          sudo apt-get update -q
          sudo apt-get install -y imagemagick

      - name: Normalize source repo URL
        id: repo
        run: |
          REPO="${{ vars.PKR_SRC_REPO }}"
          REPO="${REPO%/}"
          REPO="${REPO%.git}"
          echo "url=$REPO" >> "$GITHUB_OUTPUT"

      - name: Clone PokeRogue
        run: git clone --recurse-submodules --depth 1 --branch ${{ inputs.branch || 'main' }} ${{ steps.repo.outputs.url }}.git pokerogue-src

      - name: Get PokeRogue version
        id: pokerogue_version
        run: |
          VERSION=$(node -p "require('./pokerogue-src/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Apply patches
        env:
          PKR_SRC_REPO: ${{ steps.repo.outputs.url }}
        run: bash ${{ github.workspace }}/scripts/apply-patches.sh android

      - name: Inject build name and number into banner
        run: |
          BUILD_NUM=${{ inputs.build_number || github.run_number }}
          sed -i "s/BUILD_NAME_PLACEHOLDER/${{ vars.BUILD_NAME }}/g" pokerogue-src/src/ui/handlers/title-ui-handler.ts
          if [ "${{ inputs.dev }}" = "true" ]; then
            sed -i "s/BUILD_NUMBER_PLACEHOLDER/${BUILD_NUM} DEV/g" pokerogue-src/src/ui/handlers/title-ui-handler.ts
          else
            sed -i "s/BUILD_NUMBER_PLACEHOLDER/${BUILD_NUM}/g" pokerogue-src/src/ui/handlers/title-ui-handler.ts
          fi

      - name: Inject package/app names into Android configs
        run: |
          sed -i "s/PKG_NAME_PLACEHOLDER/${{ vars.PKG_NAME }}/g; s/APP_DISPLAY_NAME_PLACEHOLDER/${{ vars.APP_DISPLAY_NAME }}/g" \
            ${{ github.workspace }}/configs/android/capacitor/capacitor.config.json \
            ${{ github.workspace }}/configs/android/capacitor/capacitor.config-dev.json \
            ${{ github.workspace }}/configs/android/java/MainActivity.java

      - name: Generate app icons
        run: bash ${{ github.workspace }}/scripts/generate-icons.sh

      - name: Install PokeRogue dependencies
        working-directory: pokerogue-src
        run: pnpm install

      - name: Install Capacitor
        working-directory: pokerogue-src
        run: |
            pnpm add @capacitor/core@8.4.1 @capacitor/cli@8.4.1 @capacitor/android@8.4.1 @capacitor/filesystem@8.1.2 @capacitor/share@8.0.1 @capacitor/status-bar@8.0.2

      - name: Configure Capacitor
        working-directory: pokerogue-src
        run: |
          if [ "${{ inputs.dev }}" = "true" ]; then
            cp ${{ github.workspace }}/configs/android/capacitor/capacitor.config-dev.json capacitor.config.json
          else
            cp ${{ github.workspace }}/configs/android/capacitor/capacitor.config.json capacitor.config.json
          fi

      - name: Build PokeRogue
        working-directory: pokerogue-src
        env:
          VITE_BYPASS_LOGIN: '1'
        run: pnpm build --mode app

      - name: Apply post-build patches
        run: bash ${{ github.workspace }}/scripts/apply-post-build-patches.sh android

      - name: Add Android platform
        working-directory: pokerogue-src
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: pokerogue-src
        run: npx cap sync android

      - name: Copy static MainActivity
        working-directory: pokerogue-src
        run: |
          DEST=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          cp ${{ github.workspace }}/configs/android/java/MainActivity.java "$DEST"
          if [ "${{ inputs.dev }}" = "true" ]; then
            sed -i "s/^package ${{ vars.PKG_NAME }};/package ${{ vars.PKG_NAME }}dev;/" "$DEST"
          fi

      - name: Patch AndroidManifest to prevent keyboard resize
        working-directory: pokerogue-src
        run: node ${{ github.workspace }}/patches/android/node/android-manifest-keyboard-fix.js

      - name: Fix Android permissions
        working-directory: pokerogue-src
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          grep -q "WRITE_EXTERNAL_STORAGE" $MANIFEST || \
            sed -i 's|<application|<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <application|' $MANIFEST
          echo "Contents of ${MANIFEST}"
          cat $MANIFEST

      - name: Copy app icon
        run: |
          if [ "${{ inputs.dev }}" = "true" ]; then
            ICON_SRC="${{ github.workspace }}/docs/appIcon-dev.png"
          else
            ICON_SRC="${{ github.workspace }}/docs/appIcon.png"
          fi
          ICON_ADAPTIVE="${{ github.workspace }}/docs/appIcon-adaptive.png"
          RES_DIR="pokerogue-src/android/app/src/main/res"

          # Legacy icons
          convert "$ICON_SRC" -resize 48x48   "$RES_DIR/mipmap-mdpi/ic_launcher.png"
          convert "$ICON_SRC" -resize 72x72   "$RES_DIR/mipmap-hdpi/ic_launcher.png"
          convert "$ICON_SRC" -resize 96x96   "$RES_DIR/mipmap-xhdpi/ic_launcher.png"
          convert "$ICON_SRC" -resize 144x144 "$RES_DIR/mipmap-xxhdpi/ic_launcher.png"
          convert "$ICON_SRC" -resize 192x192 "$RES_DIR/mipmap-xxxhdpi/ic_launcher.png"

          cp "$RES_DIR/mipmap-mdpi/ic_launcher.png"    "$RES_DIR/mipmap-mdpi/ic_launcher_round.png"
          cp "$RES_DIR/mipmap-hdpi/ic_launcher.png"    "$RES_DIR/mipmap-hdpi/ic_launcher_round.png"
          cp "$RES_DIR/mipmap-xhdpi/ic_launcher.png"   "$RES_DIR/mipmap-xhdpi/ic_launcher_round.png"
          cp "$RES_DIR/mipmap-xxhdpi/ic_launcher.png"  "$RES_DIR/mipmap-xxhdpi/ic_launcher_round.png"
          cp "$RES_DIR/mipmap-xxxhdpi/ic_launcher.png" "$RES_DIR/mipmap-xxxhdpi/ic_launcher_round.png"

          # Foreground layers for adaptive icon (1.5x size)
          convert "$ICON_ADAPTIVE" -resize 72x72   "$RES_DIR/mipmap-mdpi/ic_launcher_foreground.png"
          convert "$ICON_ADAPTIVE" -resize 108x108 "$RES_DIR/mipmap-hdpi/ic_launcher_foreground.png"
          convert "$ICON_ADAPTIVE" -resize 144x144 "$RES_DIR/mipmap-xhdpi/ic_launcher_foreground.png"
          convert "$ICON_ADAPTIVE" -resize 216x216 "$RES_DIR/mipmap-xxhdpi/ic_launcher_foreground.png"
          convert "$ICON_ADAPTIVE" -resize 288x288 "$RES_DIR/mipmap-xxxhdpi/ic_launcher_foreground.png"

          # Adaptive icon XMLs - same image for both layers for full bleed
          mkdir -p "$RES_DIR/mipmap-anydpi-v26"
          cp ${{ github.workspace }}/configs/android/res/mipmap-anydpi-v26/ic_launcher.xml "$RES_DIR/mipmap-anydpi-v26/ic_launcher.xml"
          cp ${{ github.workspace }}/configs/android/res/mipmap-anydpi-v26/ic_launcher_round.xml "$RES_DIR/mipmap-anydpi-v26/ic_launcher_round.xml"

      - name: Set version in build.gradle
        working-directory: pokerogue-src/android/app
        # Requires the source repo's package.json version to be 4-part
        # (major.minor.patch.hotfix) — this encodes it into Android's
        # numeric versionCode. A 3-part (or otherwise-shaped) version string
        # will produce a wrong/empty HOTFIX segment and a bad versionCode.
        run: |
          BUILD_NUM=${{ inputs.build_number || github.run_number }}
          VERSION="${{ steps.pokerogue_version.outputs.version }}"

          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          HOTFIX=$(echo "$VERSION" | cut -d. -f4)

          VERSION_CODE=$(( MINOR * 100000000 + PATCH * 1000000 + HOTFIX * 10000 + BUILD_NUM ))
          VERSION_NAME="${VERSION}.${BUILD_NUM}"

          sed -i "s/versionCode .*/versionCode $VERSION_CODE/" build.gradle
          sed -i "s/versionName .*/versionName \"$VERSION_NAME\"/" build.gradle

      - name: Make gradlew executable
        working-directory: pokerogue-src/android
        run: chmod +x gradlew

      - name: Ensure debug keystore exists
        # This fork's own configs/android/debug.keystore is committed the
        # first time any build needs it (this step), then reused by every
        # build after — signing must stay consistent across builds or
        # Android refuses to install an update over the existing app.
        # Not a secret: Android debug keystores use fixed, publicly
        # documented passwords by convention (same ones Android Studio
        # generates locally for every developer). What needs to be unique
        # per fork is the key material itself, not these values.
        run: |
          KEYSTORE="${{ github.workspace }}/configs/android/debug.keystore"

          if [ -f "$KEYSTORE" ]; then
            echo "Debug keystore already committed to this fork, using it."
            exit 0
          fi

          echo "No debug keystore in this fork yet — generating one now."
          mkdir -p "$(dirname "$KEYSTORE")"
          keytool -genkey -v -keystore "$KEYSTORE" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug, O=Android, C=US"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "$KEYSTORE"
          git commit -m "Generate debug keystore for Android builds"

          for i in 1 2 3; do
            if git push origin "HEAD:${{ github.ref_name }}"; then
              echo "Committed and pushed the new keystore."
              exit 0
            fi
            echo "Push rejected (another run may have generated one first) — checking..."
            git fetch origin "${{ github.ref_name }}"
            if git cat-file -e "origin/${{ github.ref_name }}:configs/android/debug.keystore" 2>/dev/null; then
              echo "Another run already committed a keystore for this fork — using theirs instead."
              git checkout "origin/${{ github.ref_name }}" -- "$KEYSTORE"
              exit 0
            fi
            git rebase "origin/${{ github.ref_name }}"
            sleep $((RANDOM % 4 + 1))
          done

          echo "ERROR: could not commit the generated keystore after 3 attempts." >&2
          exit 1

      - name: Copy debug keystore
        run: |
          mkdir -p ~/.android
          cp ${{ github.workspace }}/configs/android/debug.keystore ~/.android/debug.keystore

      - name: Build release APK
        working-directory: pokerogue-src/android
        run: |
          ./gradlew assembleDebug \
            -Pandroid.injected.signing.store.file=$HOME/.android/debug.keystore \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android

      - name: Rename resulting APK
        run: |
          UNSIGNED="pokerogue-src/android/app/build/outputs/apk/debug/app-debug.apk"
          if [ "${{ inputs.dev }}" = "true" ]; then
            OUTPUT="${{ vars.APP_FILENAME }}-dev.apk"
          else
            OUTPUT="${{ vars.APP_FILENAME }}.apk"
          fi
          cp -v $UNSIGNED $OUTPUT
          echo "APK_NAME=$OUTPUT" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ vars.APP_FILENAME }}-Android${{ inputs.dev && '-dev' || '' }}
          path: ${{ env.APK_NAME }}
          retention-days: 30
