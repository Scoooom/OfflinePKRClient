name: Build Offline Client AppImage

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (leave blank to use this workflow run number)'
        required: false
        type: string
      dev:
        description: 'Dev build (banner marker + -dev naming)'
        required: false
        type: boolean
        default: false
      branch:
        description: 'PokeRogue branch to build from'
        required: false
        type: string
        default: 'main'
      version_override:
        description: 'Override the app version baked into this build (e.g. 1.12.0.0). Leave blank to use whatever the source repo currently declares.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Validate required repo variables
        run: |
          MISSING=0
          check_var() {
            if [ -z "$2" ]; then
              echo "::error::Missing required repository variable: $1 (Settings -> Secrets and variables -> Actions -> Variables — see README)"
              MISSING=1
            fi
          }
          check_var "PKR_SRC_REPO" "${{ vars.PKR_SRC_REPO }}"
          check_var "PKG_NAME" "${{ vars.PKG_NAME }}"
          check_var "APP_FILENAME" "${{ vars.APP_FILENAME }}"
          check_var "APP_DISPLAY_NAME" "${{ vars.APP_DISPLAY_NAME }}"
          check_var "BUILD_NAME" "${{ vars.BUILD_NAME }}"
          [ "$MISSING" -eq 1 ] && exit 1
          exit 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install ImageMagick
        run: |
          sudo apt-get update -q
          sudo apt-get install -y imagemagick

      - name: Normalize source repo URL
        id: repo
        run: |
          REPO="${{ vars.PKR_SRC_REPO }}"
          REPO="${REPO%/}"
          REPO="${REPO%.git}"
          echo "url=$REPO" >> "$GITHUB_OUTPUT"

      - name: Clone PokeRogue
        run: git clone --recurse-submodules --depth 1 --branch ${{ inputs.branch || 'main' }} ${{ steps.repo.outputs.url }}.git pokerogue-src

      - name: Get PokeRogue version
        id: pokerogue_version
        env:
          VERSION_OVERRIDE: ${{ inputs.version_override }}
        run: |
          if [ -n "$VERSION_OVERRIDE" ]; then
            if ! [[ "$VERSION_OVERRIDE" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
              echo "ERROR: version_override '$VERSION_OVERRIDE' must look like #.#.#[.#]" >&2
              exit 1
            fi
            node -e "
              const fs = require('fs');
              const pkg = require('./pokerogue-src/package.json');
              pkg.version = process.env.VERSION_OVERRIDE;
              fs.writeFileSync('./pokerogue-src/package.json', JSON.stringify(pkg, null, 2) + '\n');
            "
          fi
          VERSION=$(node -p "require('./pokerogue-src/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Apply patches
        env:
          PKR_SRC_REPO: ${{ steps.repo.outputs.url }}
        run: bash ${{ github.workspace }}/scripts/apply-patches.sh appimage

      - name: Inject build name and number into banner
        run: |
          BUILD_NUM=${{ inputs.build_number || github.run_number }}
          sed -i "s/BUILD_NAME_PLACEHOLDER/${{ vars.BUILD_NAME }}/g" pokerogue-src/src/ui/handlers/title-ui-handler.ts
          if [ "${{ inputs.dev }}" = "true" ]; then
            sed -i "s/BUILD_NUMBER_PLACEHOLDER/${BUILD_NUM} DEV/g" pokerogue-src/src/ui/handlers/title-ui-handler.ts
          else
            sed -i "s/BUILD_NUMBER_PLACEHOLDER/${BUILD_NUM}/g" pokerogue-src/src/ui/handlers/title-ui-handler.ts
          fi

      - name: Inject package/app names into Electron config
        run: sed -i "s/PKG_NAME_PLACEHOLDER/${{ vars.PKG_NAME }}/g; s/APP_DISPLAY_NAME_PLACEHOLDER/${{ vars.APP_DISPLAY_NAME }}/g" ${{ github.workspace }}/configs/desktop/electron/electron-builder.appimage.json

      - name: Generate app icons
        run: bash ${{ github.workspace }}/scripts/generate-icons.sh

      - name: Install PokeRogue dependencies
        working-directory: pokerogue-src
        run: pnpm install

      - name: Install Electron dependencies
        working-directory: pokerogue-src
        run: pnpm add -D electron@43.0.0 electron-builder@26.15.3

      - name: Build PokeRogue
        working-directory: pokerogue-src
        env:
          VITE_BYPASS_LOGIN: '1'
        run: pnpm build --mode app

      - name: Apply post-build patches
        run: bash ${{ github.workspace }}/scripts/apply-post-build-patches.sh appimage

      - name: Copy Electron config files into place
        run: |
          cp ${{ github.workspace }}/configs/desktop/electron/main.cjs pokerogue-src/main.cjs
          cp ${{ github.workspace }}/configs/desktop/electron/electron-builder.appimage.json pokerogue-src/electron-builder.json
          cp ${{ github.workspace }}/docs/appIcon.png pokerogue-src/appIcon.png

      - name: Set electron main in package.json
        working-directory: pokerogue-src
        env:
          APP_DISPLAY_NAME: ${{ vars.APP_DISPLAY_NAME }}
        run: |
          node -e "
            const pkg = require('./package.json');
            pkg.description = process.env.APP_DISPLAY_NAME;
            pkg.main = 'main.cjs';
            require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Get 3 Num Version
        id: old_ver
        working-directory: pokerogue-src
        shell: bash
        run: |
          sed -i -E 's/"version": "([0-9]+\.[0-9]+\.[0-9]+)\.([0-9]+)"/"version": "\1-\2"/' package.json
          VERSION=$(jq -r '.version | sub("(?<v>[0-9]+\\.[0-9]+\\.[0-9]+)\\-(?<h>[0-9]+)"; .v + .h)' package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected Version: '$VERSION'"

      - name: Generate AppImage
        working-directory: pokerogue-src
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm electron-builder --linux AppImage --config electron-builder.json --config.extraMetadata.version=${{ steps.old_ver.outputs.version }}

      - name: Rename and save AppImage
        id: appimage_path
        run: |
          FILE=$(find . -maxdepth 4 -type f -name "*.AppImage")
          if [ "${{ inputs.dev }}" = "true" ]; then
            OUTPUT="./${{ vars.APP_FILENAME }}-dev.AppImage"
          else
            OUTPUT="./${{ vars.APP_FILENAME }}.AppImage"
          fi
          mv "$FILE" "$OUTPUT"
          echo "AppImage=$OUTPUT" >> $GITHUB_OUTPUT

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ vars.APP_FILENAME }}-AppImage${{ inputs.dev && '-dev' || '' }}
          path: ${{ steps.appimage_path.outputs.AppImage }}
          retention-days: 30
